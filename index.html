1.5px;font-weight:800}h1{font-size:clamp(31px,4vw,54px);letter-spacing:-2px;line-height:1.12;margin:12px 0 18px}h1 span{color:var(--deep)}.lead{font-size:18px;color:#506275;max-width:600px}.heroActions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.heroVisual{min-height:310px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:12px;position:relative}.person{background:white;border:1px solid #d8ece5;border-radius:19px;text-align:center;padding:26px 13px;box-shadow:var(--shadow);position:relative}.person:nth-child(2){transform:translateY(-25px)}.person .emoji{font-size:54px}.person b{display:block;margin-top:10px}.person small{color:var(--gray)}.person .mini{margin-top:12px;background:var(--mint);border-radius:8px;padding:7px;font-size:11px}.section{padding:48px 0}h2{font-size:clamp(24px,3vw,32px);line-height:1.2;margin:0 0 10px;letter-spacing:-.7px}.sub{color:var(--gray);margin:0 0 24px}.center{text-align:center}.card{background:white;border:1px solid #e0ebe9;border-radius:16px;padding:22px;box-shadow:var(--shadow)}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.feature .ico{display:grid;place-items:center;font-size:29px;background:var(--mint);width:58px;height:58px;border-radius:18px;margin-bottom:14px}.feature h3{margin:0 0 5px}.feature p,.muted{color:var(--gray)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}.step{display:flex;gap:13px}.stepNum{display:grid;place-items:center;background:var(--green);color:white;border-radius:50%;width:30px;height:30px;flex:none;font-weight:800}.notice{background:#e7f4f4;color:#246273;padding:12px 16px;border-radius:9px;font-size:13px;margin-top:22px}.foot{background:#075744;color:white;padding:20px 0;margin-top:40px}.foot .container{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.foot small{color:#cde9dd}.page{padding:38px 0 15px;min-height:65vh}.pageTop{background:linear-gradient(110deg,#eaf8f5,#e9f6fd);padding:34px 0}.pageTop h1 ableWrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:570px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5eeeb}th{background:#f0f6f6}tr:hover td{background:#f9fcfb}.roleChip{border-radius:9px;padding:8px 12px;background:#e5f5ee;color:var(--deep);font-weight:750;display:inline-block}.eduGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.edu{display:flex;gap:15px}.edu .ico{font-size:43px;background:var(--mint);padding:12px;border-radius:14px;height:fit-content}.edu h3{margin:0 0 4px}.edu p{color:var(--gray);margin:0 0 10px}.inlineSteps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.flowBox{text-align:center;border:1px solid #b9dcce;border-radius:12px;padding:15px 9px;background:white}.flowBox b{display:block}.flowArrow{text-align:center;font-size:22px;color:var(--green)}.branch{display:grid;grid-template-columns:1fr 1fr;gap:18px}.branch>div{border:1px solid #d5e4df;border-radius:15px;padding:20px;background:white}.demoTag{font-size:12px;background:#ffedc9;color:#835600;padding:5px 10px;border-radius:20px;font-weight:700}.alert{border-radius:10px;background:#fff7e8;border:1px solid #f3d9a4;padding:13px 15px}.hidden{display:none!important}.result{padding:12px;border-radius:10px;background:#e8f6ed;color:#17623a;margin-top:12px}a{color:var(--green)}@media(max-width:900px){.links{display:none}.menuBtn{display:block}.mobileMenu{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 13px}.mobileMenu.hidden{display:none!important}.heroGrid,.cols,.colsEqual{grid-template-columns:1fr}.heroVisual{min-height:220px}.features,.steps,.stats{grid-template-columns:repeat(2,1fr)}.inlineSteps{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.nav{min-height:65px}.brand{font-size:16px}.brand small{font-size:9px}.logo{width:35px;height:35px;font-size:22px}.hero{padding:34px 0}.heroVisual{gap:6px}.person{padding:12px 5px;border-radius:12px}.person .emoji{font-size:34px}.person small{font-size:10px}.person b{ </style></head><body><header class="top"><div class="container nav"><div class="brand" onclick="go('home')"><span class="logo">🌿</span><span>JEJAK <b>DIABETES</b><small>Pantau Rujukan, Dukung Pencegahan</small></span></div><nav class="links" id="desktopNav"></nav><button class="btn small" onclick="go('petugas')">👤 Mode Petugas</button><button class="menuBtn" onclick="document.getElementById('mobileNav').classList.toggle('hidden')" aria-label="Buka navigasi">☰</button></div><nav class="container mobileMenu hidden" id="mobileNav"></nav></header><main id="view"></main><footer class="foot"><div class="container"><span><b>🌿 JEJAK DIABETES</b> <small> — Kolaborasi apoteker dan puskesmas</small></span><small>Prototipe konseptual • Seluruh data adalah simulasi • Tidak untuk diagnosis</small></div></footer><script>
const NAV=[['home','Beranda'],['status','Status Rujukan'],['pengingat','Pengingat'],['edukasi','Edukasi Diabetes'],['alur','Cara Kerja'],['petugas','Dasbor Petugas']];const KEY='jejak_v2_simulasi';const initial=[{id:'JD-001',date:'12 Okt 2026',place:'Puskesmas Sukamaju',status:'belum',barriers:['Jadwal tidak sesuai']},{id:'JD-002',date:'13 Okt 2026',place:'Puskesmas Sukamaju',status:'lapor',barriers:[]},{id:'JD-003',date:'14 Okt 2026',place:'Puskesmas Sukamaju',status:'verified',barriers:[]},{id:'JD-004',date:'15 Okt 2026',place:'Puskesmas Sukamaju',status:'belum',barriers:['Kendala transportasi']}];let db=(()=>{try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length===4?x:structuredClone(initial)}catch{return structuredClone(initial)}})();let currentId='JD-001',role='puskesmas';function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function patient(){return db.find(d=>d.id===currentId)}function statusName(s){return s==='verified'?'Terverifikasi selesai':s==='lapor'?'Menunggu verifikasi':'Belum menjalani pemeriksaan'}function badge(s){return `<span class="pill ${s==='verified'?'':s==='lapor'?'blue':'amber'}">${statusName(s)}</span>`}function go(page){location.hash=page;render();window.scrollTo({top:0,behavior:'instant'})}function header(title,subtitle){return `<div class="pageTop"><div class="container"><div class="kicker">Prototipe interaktif • Data simulasi</div><h1>${title}</h1><p>${subtitle}</p></div></div>`}function renderNav(active){let content=NAV.map(([id,label])=>`<button class="${active===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.getElementById('desktopNav').innerHTML=content;document.getElementById('mobileNav').innerHTML=content;document.getElementById('mobileNav').classList.add('hidden')}
function home(){return `<div class="hero"><div class="container heroGrid"><div><div class="kicker">Inovasi pemantauan rujukan diabetes</div><h1>Pantau Rujukan,<br><span>Dukung Pencegahan Diabetes</span></h1><p class="lead">JEJAK DIABETES membantu individu berisiko memantau pemeriksaan lanjutan melalui rancangan kolaborasi apoteker dan puskesmas.</p><div class="heroActions"><button class="btn" onclick="go('status')">Lihat Status Rujukan →</button><button class="btn outline" onclick="go('alur')">▷ Pelajari Cara Kerja</button></div></div><div class="heroVisual"><div class="person"><div class="emoji">🧑‍💻</div><b>Individu</b><small>Berisiko diabetes</small><div class="mini">Melapor & memantau</div></div><div class="person"><div class="emoji">👩‍⚕️</div><b>Apoteker</b><small>Edukasi & pengingat</small><div class="mini">Dukungan tindak lanjut</div></div><div class="person"><div class="emoji">🏥</div><b>Puskesmas</b><small>Pemeriksaan & konfirmasi</small><div class="mini">Verifikasi sesuai prosedur</div></div></div></div></div><section class="container section"><h2 class="center">Fitur Utama <span style="color:var(--green)">JEJAK DIABETES</span></h2><p class="center sub">Pemantauan rujukan dalam satu rancangan alur kerja yang terstruktur.</p><div class="features">${[['📋','Status Rujukan','Pantau perkembangan sampai konfirmasi pemeriksaan.','status'],['🔔','Pengingat Pemeriksaan','Dukung peserta dalam mengingat pemeriksaan lanjutan.','pengingat'],['📝','Catat Hambatan','Laporkan kendala yang menghambat pemeriksaan.','pengingat'],['📚','Edukasi Diabetes','Akses informasi umum dari sumber tepercaya.','edukasi']].map(x=>`<div class="card feature"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn light small" onclick="go('${x[3]}')">Buka fitur →</button></div>`).join('')}</div><h2 class="center" style="margin-top:42px">Bagaimana JEJAK DIABETES Bekerja?</h2><div class="steps">${[['1','Skrining risiko','Identifikasi individu berisiko.'],['2','Pemberian rujukan','Arahkan ke fasilitas yang sesuai.'],['3','Pemantauan','Catat status dan kendala.'],['4','Konfirmasi','Puskesmas memverifikasi pemeriksaan.']].map(x=>`<div class="step"><span class="stepNum">${x[0]}</span><div><b>${x[1]}</b><div class="muted">${x[2]}</div></div></div>`).join('')}</div><div class="notice">ℹ️ JEJAK DIABETES mendukung tindak lanjut setelah skrining, <b>bukan untuk menetapkan diagnosis diabetes</b>.</div></section>`}
function pick(){return `<div class="field"><label for="patient">Pilih peserta simulasi</label><select id="patient" onchange="currentId=this.value;render()">${db.map(x=>`<option ${x.id===currentId?'selected':''} value="${x.id}">${x.id} — ${statusName(x.status)}</option>`).join('')}</select></div>`}function timeline(){let p=patient();let steps=[['🩺','Skrining Risiko','Selesai'],['📄','Pemberian Rujukan','Selesai'],['🩻','Pemeriksaan Lanjutan',p.status==='belum'?'Belum dilakukan':p.status==='lapor'?'Dilaporkan peserta':'Terkonfirmasi'],['✅','Konfirmasi Tindak Lanjut',p.status==='verified'?'Terverifikasi':'Menunggu konfirmasi']];return `<div class="timeline">${steps.map(s=>`<div class="tlItem"><div class="tlIcon">${s[0]}</div><div><b>${s[1]}</b><small>${s[2]}</small></div></div>`).join('')}</div>`}function status(){let p=patient();return header('Status Rujukan Saya','Pantau tindak lanjut mulai dari skrining hingga konfirmasi pemeriksaan lanjutan.')+`<section class="container section">${pick()}<div class="card" style="margin-bottom:18px"><div class="stats"><div><label class="muted">ID Peserta</label><h3>${p.id}</h3></div><div><label class="muted">Tanggal Rujukan</label><h3>${p.date}</h3></div><div><label class="muted">Lokasi Skrining</label><h3>Skrining Komunitas</h3></div><div><label class="muted">Fasilitas Tujuan</label><h3>${p.place}</h3></div></div></div><div class="cols"><div><div class="card"><h3 class="titleSmall">Tahapan Status Rujukan</h3>${timeline()}</div><div class="card" style="margin-top:17px"><h3 class="titleSmall">Status Saat Ini</h3>${badge(p.status)}<p class="muted">${p.status==='lapor'?'Peserta melaporkan pemeriksaan telah dilakukan, tetapi belum diverifikasi puskesmas.':p.status==='verified'?'Pemeriksaan telah dikonfirmasi dalam simulasi oleh petugas puskesmas.':'Pemeriksaan belum dilaporkan selesai.'}</p><div class="actions"><button class="btn" onclick="go('pengingat')">Perbarui Status</button><button class="btn outline" onclick="go('petugas')">Lihat Dasbor Petugas</button></div></div></div><div class="card"><h3 class="titleSmall">Riwayat Tindak Lanjut</h3><div class="track"><div class="event"><b>Skrining dilakukan</b><small> • ${p.date}</small><p>Hasil skrining menunjukkan adanya risiko.</p></div><div class="event"><b>Rujukan diberikan</b><small> • ${p.date}</small><p>Peserta diarahkan ke fasilitas tujuan.</p></div><div class="event"><b>Status terkini</b><p>${statusName(p.status)}</p></div></div><div class="notice">Laporan mandiri bukan konfirmasi klinis. Data di halaman ini hanya simulasi.</div></div></div></section>`}
function pengingat(){let p=patient();return header('Pengingat dan Hambatan Rujukan','Sampaikan perkembangan pemeriksaan dan kendala yang dihadapi.')+`<section class="container section"><div class="card" style="margin-bottom:18px"><h3>🔔 Pengingat Pemeriksaan Lanjutan</h3><p class="muted">Peserta <b>${p.id}</b> • ${p.place} • ${badge(p.status)}</p><p>Periksa informasi rujukan dan hubungi fasilitas pelayanan kesehatan jika memerlukan arahan.</p></div><div class="colsEqual"><div class="card">${pick()}<div class="field"><div class="label">Apakah pemeriksaan lanjutan sudah dilakukan?</div><div class="options"><label class="option"><input type="radio" name="exam" value="belum" ${p.status==='belum'?'checked':''}> Belum</label><label class="option"><input type="radio" name="exam" value="lapor" ${p.status!=='belum'?'checked':''}> Sudah (laporan mandiri)</label></div></div><div class="field"><div class="label">Jika belum, apa hambatan yang dialami?</div><div class="checks">${['Jadwal tidak sesuai','Kendala transportasi','Kendala biaya','Belum memahami prosedur rujukan','Belum sempat datang','Alasan lainnya'].map(s=>`<label class="check"><input name="barrier" type="checkbox" value="${s}" ${p.barriers.includes(s)?'checked':''}> ${s}</label>`).join('')}</div></div><button class="btn" onclick="saveReport()">💾 Simpan Informasi</button><div id="saved"></div></div><div class="actionBox"><h3>💡 Tindak Lanjut yang Dapat Dilakukan</h3><p>Baca panduan pemeriksaan lanjutan atau hubungi apoteker/petugas yang berwenang untuk mendapatkan penjelasan.</p><hr style="border:0;border-top:1px solid #bdd8e9"><p>Jika jadwal atau transportasi menjadi kendala, tanyakan informasi layanan dan pilihan waktu pemeriksaan pada fasilitas tujuan.</p><div class="alert">🔒 Prototipe tidak mengirim SMS atau WhatsApp. Data yang diisi hanya tersimpan secara lokal di browser ini.</div></div></div></section>`}function saveReport(){let p=patient(),checked=document.querySelector('input[name=exam]:checked');p.status=checked?.value==='lapor'?'lapor':'belum';p.barriers=[...document.querySelectorAll('input[name=barrier]:checked')].map(x=>x.value);persist();render();document.getElementById('saved').innerHTML='<div class="result">Data simulasi berhasil diperbarui. Lihat halaman Status Rujukan atau Dasbor Petugas.</div>'}
const articles=[['🩸','Mengenal Faktor Risiko Diabetes','Faktor risiko dan alasan deteksi dini penting.','Risiko diabetes dapat dipengaruhi oleh beberapa faktor. Konsultasikan penilaian risiko dan kebutuhan pemeriksaan dengan tenaga kesehatan.'],['🥗','Pola Makan Seimbang','Prinsip makan seimbang sebagai bagian dari gaya hidup sehat.','Pola makan yang seimbang dapat mendukung kesehatan secara umum. Materi ini bukan anjuran diet individual.'],['🚶','Aktivitas Fisik dan Gaya Hidup Sehat','Peran aktivitas fisik dalam menjaga kesehatan.','Aktivitas fisik teratur merupakan bagian dari gaya hidup sehat; sesuaikan dengan kemampuan dan kondisi kesehatan.'],['📋','Pentingnya Pemeriksaan Lanjutan','Mengapa hasil skrining berisiko perlu ditindaklanjuti.','Hasil skrining tidak menetapkan diagnosis. Pemeriksaan lanjutan dilakukan oleh tenaga kesehatan yang berwenang.']];function edukasi(){return header('Pusat Edukasi Diabetes','Kenali risiko, pahami pemeriksaan lanjutan, dan dukung gaya hidup sehat.')+`<section class="container section"><div class="field"><input type="search" id="findArticle" placeholder="Cari materi edukasi..." oninput="filterEdu(this.value)" aria-label="Cari materi edukasi"></div><div class="eduGrid" id="eduGrid">${articles.map((x,i)=>`<div class="card edu" data-search="${x[1].toLowerCase()}"><div class="ico">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn small outline" onclick="showArticle(${i})">Baca Selengkapnya →</button></div></div>`).join('')}</div><div id="articleDetail" style="margin-top:20px"></div><div class="notice">Sumber rujukan edukasi untuk pengembangan materi: <a href="https://www.kemkes.go.id/" target="_blank" rel="noopener">Kementerian Kesehatan</a>, <a href="https://www.who.int/" target="_blank" rel="noopener">WHO</a>, dan <a href="https://diabetesatlas.org/" target="_blank" rel="noopener">IDF</a>. Materi contoh ini bukan nasihat medis individual.</div></section>`}function filterEdu(q){document.querySelectorAll('[data-search]').forEach(el=>el.classList.toggle('hidden',!el.dataset.search.includes(q.toLowerCase())))}function showArticle(i){document.getElementById('articleDetail').innerHTML=`<div class="card"><h3>${articles[i][1]}</h3><p>${articles[i][3]}</p><p class="muted">Informasi edukatif. Untuk penilaian individual, hubungi fasilitas pelayanan kesehatan.</p><button class="btn light small" onclick="document.getElementById('articleDetail').innerHTML=''">Tutup</button></div>`;document.getElementById('articleDetail').scrollIntoView({behavior:'smooth'})}
function petugas(){let counts={belum:db.filter(x=>x.status==='belum').length,lapor:db.filter(x=>x.status==='lapor').length,verified:db.filter(x=>x.status==='verified').length};return header('Dasbor Pemantauan Rujukan','Simulasi koordinasi berbasis peran antara apoteker dan puskesmas.')+`<section class="container section"><div class="field"><label>Simulasikan peran petugas</label><select onchange="role=this.value;render()"><option ${role==='puskesmas'?'selected':''} value="puskesmas">Petugas Puskesmas</option><option ${role==='apoteker'?'selected':''} value="apoteker">Apoteker</option></select><p class="muted">${role==='apoteker'?'Apoteker memberikan edukasi dan dukungan tindak lanjut; tidak memverifikasi pemeriksaan klinis.':'Puskesmas mengonfirmasi pemeriksaan dalam simulasi berdasarkan prosedur yang disepakati.'}</p></div><div class="stats" style="margin-bottom:20px"><div class="card stat"><label>Total Rujukan</label><strong>${db.length}</strong><small>Peserta simulasi</small></div><div class="card stat"><label>Belum diperiksa</label><strong style="color:#a66a07">${counts.belum}</strong><small>Perlu tindak lanjut</small></div><div class="card stat"><label>Menunggu Verifikasi</label><strong style="color:#1970a0">${counts.lapor}</strong><small>Laporan mandiri</small></div><div class="card stat"><label>Terverifikasi</label><strong style="color:var(--deep)">${counts.verified}</strong><small>Konfirmasi simulasi</small></div></div><div class="cols"><div class="card"><h3>Daftar Pemantauan Rujukan</h3><div class="tableWrap"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Status</th><th>Tindak lanjut</th></tr></thead><tbody>${db.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.date}</td><td>${badge(p.status)}</td><td>${role==='puskesmas'&&p.status==='lapor'?`<button class="btn small" onclick="verify('${p.id}')">Verifikasi Pemeriksaan</button>`:`<button class="btn outline small" onclick="currentId='${p.id}';go('${role==='apoteker'?'pengingat':'status'}')">${role==='apoteker'?'Tinjau Hambatan':'Lihat Detail'}</button>`}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>Rujukan yang Perlu Tindak Lanjut</h3>${db.filter(x=>x.status!=='verified').map(x=>`<div style="border-bottom:1px solid var(--line);padding:13px 0"><b>${x.id}</b> ${badge(x.status)}<p class="muted" style="margin:5px 0">${x.barriers.length?'Hambatan: '+x.barriers.join(', '):'Tidak ada hambatan dilaporkan.'}</p></div>`).join('')}<div class="notice">Akses berdasarkan peran hanya disimulasikan dalam prototipe. Belum ada autentikasi sungguhan.</div></div></div><div class="card" style="margin-top:18px"><h3>Keamanan dan Ruang Lingkup</h3><p class="muted">Data simulasi tersimpan hanya pada browser yang digunakan. Tidak terhubung ke database puskesmas dan tidak boleh dipakai untuk mencatat identitas atau data kesehatan asli.</p><button class="btn outline small" onclick="resetData()">↺ Reset Data Simulasi</button></div></section>`}function verify(id){if(role!=='puskesmas')return;const p=db.find(x=>x.id===id);if(p?.status!=='lapor')return;p.status='verified';persist();render()}function resetData(){if(confirm('Kembalikan seluruh data simulasi ke kondisi awal?')){db=structuredClone(initial);persist();render()}}
function alur(){return header('Alur Kerja JEJAK DIABETES','Rancangan proses pemantauan rujukan dengan peran individu, apoteker, dan puskesmas.')+`<section class="container section"><div class="inlineSteps">${[['1','🩺','Skrining risiko'],['2','👥','Identifikasi individu'],['3','📄','Pemberian rujukan'],['4','💻','Pencatatan status'],['5','🔎','Pemantauan rujukan']].map(x=>`<div class="flowBox"><div style="font-size:30px">${x[1]}</div><span class="pill">Tahap ${x[0]}</span><b>${x[2]}</b></div>`).join('')}</div><div class="flowArrow">↓</div><div class="card center"><h3>Apakah pemeriksaan lanjutan sudah dilakukan?</h3><p class="muted">Keputusan berdasarkan laporan peserta; laporan selesai belum berarti sudah terverifikasi.</p></div><div class="branch" style="margin-top:16px"><div><span class="pill amber">TIDAK</span><h3>Identifikasi hambatan → Catat kendala → Berikan pengingat</h3><p class="muted">Apoteker atau petugas mendukung tindak lanjut, lalu pemantauan diulang.</p><button class="btn light small" onclick="go('pengingat')">Lihat simulasi hambatan</button></div><div><span class="pill">YA</span><h3>Laporan peserta → Konfirmasi puskesmas → Verifikasi</h3><p class="muted">Status dinyatakan terverifikasi setelah konfirmasi sesuai prosedur.</p><button class="btn light small" onclick="go('petugas')">Lihat simulasi verifikasi</button></div></div><div class="flowArrow">↓</div><div class="card center"><h3>✅ Tindak Lanjut Tercatat</h3><p>Riwayat status disimpan dan dapat dipantau petugas yang berwenang dalam rancangan sistem.</p></div><div class="features" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:20px"><div class="card"><h3>🧑 Individu</h3><p>Menjalani pemeriksaan, melaporkan status dan kendala.</p></div><div class="card"><h3>👩‍⚕️ Apoteker</h3><p>Memberikan edukasi, pengingat, dan bantuan rujukan.</p></div><div class="card"><h3>🏥 Puskesmas</h3><p>Melaksanakan pemeriksaan klinis dan konfirmasi tindak lanjut.</p></div></div><div class="alert" style="margin-top:18px">Hasil skrining bukan diagnosis. Penetapan diagnosis dan penanganan klinis tetap menjadi kewenangan tenaga kesehatan yang berwenang.</div></section>`}function render(){let page=(location.hash||'#home').substring(1);if(!NAV.some(x=>x[0]===page))page='home';renderNav(page);document.getElementById('view').innerHTML=({home,status,pengingat,edukasi,petugas,alur}[page])()}window.addEventListener('hashchange',render);render();
</script></body></html>
